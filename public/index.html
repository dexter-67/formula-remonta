<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <h2>Вход</h2>

    <form id="login-form">
      <div class="input-group">
        <input type="text" placeholder="Логин или почта" required>
      </div>
      <div class="input-group">
        <input type="password" placeholder="Пароль" required>
        <button type="submit" class="show-password">➤</button>
      </div>
      <div class="forgot-password">
        <a href="/reset">Забыли пароль?</a>
      </div>

      <div class="divider">ИЛИ</div>

      <button type="button" class="social-btn yandex">
        <span>🟥</span> Войти с Яндекс ID
      </button>
      <button type="button" class="social-btn vk">
        <span>🔵</span> Войти через VK
      </button>

      <div class="register-link">
        Нет аккаунта? <a href="/signup">Зарегистрироваться</a>
      </div>

      <div class="terms">
        Передавая указанную информацию, вы принимаете условия <a href="#">пользовательского соглашения</a>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
